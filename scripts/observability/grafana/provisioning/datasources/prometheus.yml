# Datasource Prometheus untuk Grafana (auto-provisioning saat start).
# Grafana berjalan --network host, jadi Prometheus = localhost:9090.
apiVersion: 1

datasources:
  - name: Prometheus
    type: prometheus
    uid: computehub-prom
    access: proxy
    url: http://localhost:9090
    isDefault: true
    editable: true
    jsonData:
      timeInterval: 15s
